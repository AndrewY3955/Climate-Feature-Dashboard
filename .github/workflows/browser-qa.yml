name: Browser QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Browser QA (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dashboard dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build the static dashboard
        run: python -m scripts.build_pages

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install browser test tools
        run: npm install --no-save @playwright/test@1.56.1 @axe-core/playwright@4.10.2

      - name: Install browser engines
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start local dashboard API and static GitHub Pages preview
        run: |
          python -m climate_dashboard.dashboard --port 8765 > /tmp/dashboard.log 2>&1 &
          python -m http.server 8766 --directory site > /tmp/pages-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null && curl --fail --silent http://127.0.0.1:8766/security-demo.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dashboard.log
          cat /tmp/pages-preview.log
          exit 1

      - name: Run cross-browser functional, responsive, keyboard, console, and WCAG checks
        run: npx playwright test --config=tests/browser/playwright.config.js --project=${{ matrix.browser }}

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-traces
          path: test-results/
          if-no-files-found: ignore
