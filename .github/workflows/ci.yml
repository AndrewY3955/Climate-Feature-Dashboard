name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.check_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            check_name: "ubuntu-latest, Python 3.10"
          # These two names must match the required status checks in the main ruleset.
          - os: ubuntu-latest
            python-version: "3.11"
            check_name: "Python 3.11"
          - os: ubuntu-latest
            python-version: "3.12"
            check_name: "ubuntu-latest, Python 3.12"
          - os: ubuntu-latest
            python-version: "3.13"
            check_name: "ubuntu-latest, Python 3.13"
          - os: ubuntu-latest
            python-version: "3.14"
            check_name: "Python 3.14"
          - os: windows-latest
            python-version: "3.11"
            check_name: "windows-latest, Python 3.11"
          - os: macos-latest
            python-version: "3.11"
            check_name: "macos-latest, Python 3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q climate_dashboard tests

      - name: Run tests
        run: python -m pytest -W error::DeprecationWarning
