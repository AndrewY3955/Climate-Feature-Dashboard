name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q climate_dashboard tests

      - name: Run tests
        run: python -m pytest -W error::DeprecationWarning

  active-defense-evidence:
    name: Live active-defense evidence
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Execute live attack and defense and verify evidence
        run: |
          python -c "import glob, json; from climate_dashboard.active_defense_lab import run_active_defense_lab, verify_evidence_bundle; result = run_active_defense_lab(); reports = glob.glob('evidence/active-defense-lab/*.json'); assert result['status'] == 'PASS', result; assert len(reports) == 1, reports; report = json.load(open(reports[0], encoding='utf-8')); assert verify_evidence_bundle(report); print(json.dumps({'run_id': result['run_id'], 'outcome': result['outcome'], 'evidence_path': reports[0], 'evidence_file_sha256': result['evidence_file_sha256']}))"

      - name: Upload reproducible attack-defense evidence
        if: always() && hashFiles('evidence/active-defense-lab/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: active-defense-evidence-${{ github.sha }}
          path: evidence/active-defense-lab/*.json
          if-no-files-found: error
          retention-days: 30

  required-python-3-11:
    name: Tests (Python 3.11)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the test matrix fails
        if: needs.test.result != 'success'
        run: exit 1
      - name: Confirm platform test matrix passed
        run: echo "All configured platform and Python-version tests passed."

  required-python-3-14:
    name: Tests (Python 3.14)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the test matrix fails
        if: needs.test.result != 'success'
        run: exit 1
      - name: Confirm platform test matrix passed
        run: echo "All configured platform and Python-version tests passed."
